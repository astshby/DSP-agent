name: DSP validation
on:
  push:
  pull_request:
jobs:
  numeric-and-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build:offline
      - run: git diff --exit-code -- self/第十三周/index.html
